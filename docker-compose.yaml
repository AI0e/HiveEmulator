version: "3.8"
services:
  redis:
    image: redis:latest
    restart: unless-stopped
  communication-control:
    image: ${REGISTRY}/hiveemulator/communication-control:${TAG}
    ports:
      - "${COM_PORT}:8080"
    depends_on:
      - redis
    environment:
      - Redis__ConnectionString=redis:6379
    restart: unless-stopped
  map-client:
    image: ${REGISTRY}/hiveemulator/map-client:${TAG}
    ports:
      - "${MAP_PORT}:80"
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - communication-control
    restart: unless-stopped
  hive-mind:
    image: ${REGISTRY}/hiveemulator/hive-mind:${TAG}
    ports:
      - "${HIVE_PORT}:5149"
    depends_on:
      - redis
      - communication-control
    environment:
      - Redis__ConnectionString=redis:6379
      - CommunicationConfiguration__CommunicationControlIP=communication-control
      - CommunicationConfiguration__CommunicationControlPort=8080
      - CommunicationConfiguration__HiveIP=hive-mind
      - CommunicationConfiguration__HivePort=5149
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped